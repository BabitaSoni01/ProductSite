<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Management App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- ✅ NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <!-- Brand -->
        <a class="navbar-brand" href="/">Product Management</a>

        <!-- Right side buttons -->
        <div class="d-flex">

            <a href="{% url 'home' %}" class="btn btn-outline-light me-2">Home</a>
            {% if user.is_authenticated %}
                <a href="{% url 'productlist' %}" class="btn btn-outline-light me-2">Products</a>
                {% comment %} <a href="/addproduct/" class="btn btn-success me-2">+ Add Product</a> {% endcomment %}
            {% endif    %}

            {% if user.is_authenticated %}
                <span class="text-white me-3 align-self-center">
                    Hi, {{ user.username }}
                </span>
                <a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-primary">Login</a>
            {% endif %}

        </div>

    </div>
</nav>

<!-- ✅ PAGE CONTENT -->
<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
